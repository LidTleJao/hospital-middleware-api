services:
  postgres:
    image: postgres:16-alpine
    container_name: hospital-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hospital}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hospital}
      POSTGRES_DB: ${POSTGRES_DB:-hospital}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hospital} -d ${POSTGRES_DB:-hospital}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [hospital-net]

  # One-shot container: applies every pending migration, then exits 0.
  migrate:
    image: migrate/migrate:v4.18.2
    container_name: hospital-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-hospital}:${POSTGRES_PASSWORD:-hospital}@postgres:5432/${POSTGRES_DB:-hospital}?sslmode=disable"
      - "up"
    restart: on-failure
    networks: [hospital-net]

  api:
    build:
      context: .
      target: runtime
    container_name: hospital-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_PORT: "8080"
      GIN_MODE: ${GIN_MODE:-release}
      DATABASE_URL: postgres://${POSTGRES_USER:-hospital}:${POSTGRES_PASSWORD:-hospital}@postgres:5432/${POSTGRES_DB:-hospital}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-env}
      JWT_TTL: ${JWT_TTL:-24h}
      HIS_BASE_URL: ${HIS_BASE_URL:-https://hospital-a.api.co.th}
      HIS_TIMEOUT: ${HIS_TIMEOUT:-10s}
    # No published port: everything reaches the API through nginx.
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [hospital-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: hospital-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [hospital-net]

volumes:
  postgres-data:

networks:
  hospital-net:
    driver: bridge
