worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent upstream=$upstream_addr '
                      'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # The API container. Docker's embedded DNS resolves "api" on the
    # compose network, so scaling the service just works.
    upstream api_backend {
        server api:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 1m;

        # Declared once at server level: a location block does not inherit
        # directives from a sibling, so keeping these inside "location /"
        # would leave /health without the forwarding headers.
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Health probe: proxied but never written to the access log.
        location = /health {
            access_log off;
            proxy_pass http://api_backend;
        }

        location / {
            proxy_pass http://api_backend;
        }
    }
}
